# Packaging for Zode for Mac: Developer ID signed, hardened runtime. Notarization is a separate step (scripts/release.sh).
appId: dev.zode.mac
productName: Zode
copyright: Copyright © Comex Technologies Pte Ltd
publish:                             # self-update source: electron-builder writes latest-mac.yml and
  - provider: github                 # app-update.yml from this; no token here, releases are published
    owner: zrll2                     # with GH_TOKEN at release time only
    repo: zode
    releaseType: release
directories:
  output: release
  buildResources: resources
files:
  - package.json
  - dist/**
asar: true
extraResources:                      # the "engine kit": what the setup wizard needs to build ZCode Engine.app
  - from: ../scripts/build-tap.sh
    to: engine-kit/scripts/build-tap.sh
  - from: ../scripts/update-zcode.sh
    to: engine-kit/scripts/update-zcode.sh
  - from: ../bridge/agent-wrapper.mjs
    to: engine-kit/bridge/agent-wrapper.mjs
  - from: vendor/whisper-cli          # the voice engine (whisper.cpp, built by scripts/build-whisper.sh)
    to: bin/whisper-cli               # the app runs it at process.resourcesPath/bin/whisper-cli
  - from: resources/Assets.car       # compiled from resources/Icon.xcassets (actool): macOS 26 draws the icon on its own rounded plate
    to: Assets.car
  - from: bin/zode-watch.mjs          # the Claude Code event watcher (runs via ELECTRON_RUN_AS_NODE)
    to: bin/zode-watch.mjs
mac:
  category: public.app-category.developer-tools
  icon: ../assets/Zode.icns
  target:
    - target: dmg
      arch: [arm64]
    - target: zip
      arch: [arm64]
  hardenedRuntime: true
  binaries:                           # extra Mach-O to sign: the packaged whisper engine
    - Contents/Resources/bin/whisper-cli
  gatekeeperAssess: false
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.plist
  identity: "Comex Technologies Pte Ltd (XP5Q8LPH52)"
  notarize: false
  extendInfo:
    CFBundleIconName: AppIcon
    LSUIElement: true                # menu bar only: no Dock icon
    NSLocalNetworkUsageDescription: Zode lets your phone reach this Mac over your local or private network.
dmg:
  title: Zode
  sign: true                         # sign the dmg too, then release.sh notarizes and staples it
