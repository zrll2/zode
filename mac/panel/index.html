<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; script-src 'self'; img-src data:">
  <title>Zode</title>
  <link rel="stylesheet" href="panel.css">
</head>
<body>
  <div class="pop">
    <div class="bar" id="bar">
      <button class="phones" id="phones" aria-label="Phones"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="7" y="2.5" width="10" height="19" rx="2.6"/><path d="M11 18.5h2"/></svg><span id="phoneTxt">0</span><i id="phoneDot"></i></button>
      <div class="grow"></div>
      <button class="ib" id="refresh" aria-label="Refresh"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.6-5.9"/><path d="M20 4v5h-5"/></svg></button>
      <button class="ib" id="gear" aria-label="Settings" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
      <button class="ib z" id="openZ" aria-label="Open ZCode"><svg viewBox="0 0 22 22" aria-hidden="true"><line x1="19.15" y1="2.84" x2="2.85" y2="19.15" stroke="currentColor" stroke-opacity=".55" stroke-width="5.3" stroke-linecap="round"/><rect x="0" y="0" width="22" height="5.3" rx="2.65" fill="currentColor"/><rect x="0" y="16.7" width="22" height="5.3" rx="2.65" fill="currentColor"/></svg></button>
    </div>
    <div class="mid" id="mid">
      <div id="banner"></div>
      <div id="needs"></div>
      <div id="running"></div>
      <button class="fin" id="finToggle" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5 10 17.5 19 7"/></svg><span id="finTxt"></span><svg class="chev" id="finChev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg></button>
      <div id="finRows"></div>
    </div>
    <div class="phones-pop" id="phonesPop" hidden></div>
    <div class="mon" id="mon" hidden>
      <div class="rate" id="rate"><b id="rateNum">0</b><span>tokens / min</span></div>
      <svg class="plot" id="plot" viewBox="0 0 340 96" preserveAspectRatio="none" role="img" aria-label="Token use over the last hour">
        <line class="gl" x1="0" x2="340" y1="36" y2="36"/><line class="gl" x1="0" x2="340" y1="60" y2="60"/><line class="gl" x1="0" x2="340" y1="84" y2="84"/>
        <polygon class="ar" id="plotArea" points=""/>
        <polyline class="ln" id="plotLine" points="" vector-effect="non-scaling-stroke"/>
      </svg>
      <div class="stats" id="stats">
        <span class="cap">avg per order</span>
        <span class="v" id="avgTok"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><ellipse cx="12" cy="6" rx="7" ry="3"/><path d="M5 6v6c0 1.7 3.1 3 7 3s7-1.3 7-3V6"/><path d="M5 12v6c0 1.7 3.1 3 7 3s7-1.3 7-3v-6"/></svg><span></span></span>
        <span class="v" id="avgTime"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span></span></span>
      </div>
    </div>
    <div class="toast" id="toast" role="status"></div>
    <div class="sheet" id="sheet" aria-hidden="true">
      <div class="hdr"><button class="ib" id="back" aria-label="Back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 6-6 6 6 6"/></svg></button><span id="sheetTitle">Settings</span></div>
      <div class="scroll" id="scroll">
        <div class="group">
          <div class="set"><span>Permissions</span><div class="seg" id="preset" role="radiogroup" aria-label="Permissions"><button data-preset="ask" role="radio" aria-checked="false">Ask</button><button data-preset="auto" role="radio" aria-checked="false">Auto</button><button data-preset="careful" role="radio" aria-checked="false">Careful</button></div></div>
          <div class="set"><span>Notify me</span><button class="sw" id="swNotify" role="switch" aria-checked="false" aria-label="Notify me"></button></div>
          <div class="set"><span>Tell Claude Code</span><button class="sw" id="swClaudeCode" role="switch" aria-checked="false" aria-label="Tell Claude Code"></button></div>
          <button class="set" id="approvals" aria-label="Approvals"><span>Approvals</span><svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg></button>
        </div>
        <div class="group">
          <div class="set"><span>Phone connection</span><button class="sw" id="swRelay" role="switch" aria-checked="false" aria-label="Phone connection"></button></div>
          <div class="set"><span>Connect via</span><div class="seg" id="addr" role="radiogroup" aria-label="Connect via"></div></div>
          <div class="set"><span>Browser access</span><button class="sw" id="swWebClient" role="switch" aria-checked="false" aria-label="Browser access"></button></div>
          <div class="set"><span>Keep my Mac awake</span><button class="sw" id="swAwake" role="switch" aria-checked="false" aria-label="Keep my Mac awake"></button></div>
          <div class="set"><span>Start at login</span><button class="sw" id="swLogin" role="switch" aria-checked="false" aria-label="Start at login"></button></div>
        </div>
        <div class="group">
          <div class="set"><span>Voice language</span><div class="seg" id="voiceLang" role="radiogroup" aria-label="Voice language"><button data-lang="en" role="radio" aria-checked="false">English</button><button data-lang="zh" role="radio" aria-checked="false">中文</button></div></div>
          <div class="set"><span>Voice model</span><span class="val" id="voiceState">Not downloaded</span><span class="voiceact" id="voiceAction"></span></div>
        </div>
        <div class="linkrow"><span class="ver" id="version">Zode</span><button class="btn" id="updatesBtn">Check for updates</button><button class="btn" id="setupBtn">Set up Zode…</button><button class="btn ghost" id="quitBtn">Quit Zode</button></div>
      </div>
      <div class="scroll" id="apprs" hidden></div>
    </div>
  </div>
  <template id="tickTpl"><svg class="tick" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5 10 17.5 19 7"/></svg></template>
  <script src="panel.js"></script>
</body>
</html>
