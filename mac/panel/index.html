<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; script-src 'self'; img-src data:">
  <title>Zode</title>
  <link rel="stylesheet" href="panel.css">
</head>
<body>
  <div class="pop">
    <div class="top" id="top">
      <div class="sum"><b id="sumTitle"></b><span id="sumSub"></span></div>
      <button class="ib" id="refresh" aria-label="Refresh"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M13.5 8a5.5 5.5 0 1 1-1.8-4.1"/><path d="M13.7 2.3v3.3h-3.3"/></svg></button>
      <button class="ib" id="gear" aria-label="Settings" aria-expanded="false"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="8" cy="8" r="2.2"/><path d="M8 1.6v1.8M8 12.6v1.8M1.6 8h1.8M12.6 8h1.8M3.5 3.5l1.3 1.3M11.2 11.2l1.3 1.3M12.5 3.5l-1.3 1.3M4.8 11.2l-1.3 1.3"/></svg></button>
    </div>
    <div class="mid" id="mid">
      <div id="banner"></div>
      <div id="needs"></div>
      <div id="working"></div>
      <div id="done"></div>
    </div>
    <div class="foot" id="foot">
      <button class="chip" id="phones"><i></i><span id="phoneTxt">No phone yet</span></button>
      <button class="btn" id="openZ">Open ZCode</button>
    </div>
    <div class="toast" id="toast" role="status"></div>
    <div class="sheet" id="sheet" aria-hidden="true">
      <header><button class="ib" id="back" aria-label="Back"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3 5 8l5 5"/></svg></button><b>Settings</b></header>
      <div class="list">
        <div class="set"><div>Keep my Mac awake<small>So your phone does not lose it</small></div><button class="sw" id="swAwake" role="switch" aria-checked="false" aria-label="Keep my Mac awake"></button></div>
        <div class="set"><div>Phone connection<small>Turn off to stop remote access</small></div><button class="sw" id="swRelay" role="switch" aria-checked="false" aria-label="Phone connection"></button></div>
        <div class="set"><div>Start Zode at login</div><button class="sw" id="swLogin" role="switch" aria-checked="false" aria-label="Start Zode at login"></button></div>
        <div class="set"><div>Reachable from</div><select id="addr" aria-label="Reachable from"></select></div>
        <div class="linkrow"><button class="btn" id="pairBtn">Pair a phone…</button><button class="btn" id="updatesBtn">Check for updates</button><button class="btn" id="setupBtn">Set up ZCode…</button></div>
        <div class="linkrow"><span class="ver" id="version">Zode</span><button class="btn quiet" id="quitBtn">Quit Zode</button></div>
      </div>
    </div>
  </div>
  <template id="tickTpl"><svg class="tick" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 7.5 5.6 10.5 11.5 3.8"/></svg></template>
  <script src="panel.js"></script>
</body>
</html>
