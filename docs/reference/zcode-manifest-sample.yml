releaseName: Release v3.16.2
releaseNotes: |-
    ## 新功能

    - 本地项目支持一次选择多个文件夹，支持修改名称
    - 远程会话支持常驻进程，本地断连不再影响远程会话
    - 输入框可直接切换模型、调节思考力度并选择团队套餐
    - 历史会话支持按项目归档管理，归档分组默认折叠
    - 设置页新增管理远程设备功能
    - Windows 任务栏与托盘显示未读任务提醒
    - 对话分享改为弹层操作，支持工作流内容与图片预览
    - 新增插件市场，可浏览、安装和管理插件
    - 图片预览支持复制、下载并引用到对话
    - 手机远控支持账号登录，使连接更安全
    - 手机远控新增管理设备功能
    - 文件浏览移至侧边面板，可多标签页打开
    - MiMo 模型支持 API 与 Token 套餐两种接入方式
    - 新增工具搜索，助手可按需查找和加载工具

    ## 问题修复

    - 修复网络中断被误报为远端环境不满足要求的问题
    - 修复模型创建失败时输入丢失、对话卡住的问题
    - 修复达到上下文上限后对话无响应的问题
    - 修复恢复历史会话时附件错乱或被误判失败的问题
    - 修复编辑中的输入在模型切换时被覆盖的问题
    - 修复加速模型不可用时无法回退或输入丢失的问题
    - 修复切换项目或新建任务时草稿丢失的问题
    - 修复后台完成任务未读数与角标计数不正确的问题
    - 修复重启后已关闭的工作区标签再次出现的问题
    - 修复 Windows 下可能越界读取本地文件的安全问题
    - 修复连接日志可能泄露敏感信息的问题
    - 修复模型菜单与思考滑杆的多处显示和交互问题
    - 修复工作流参数过多时运行按钮被挤出屏幕的问题
    - 修复数据库升级后偶发锁定卡顿的问题
    - 修复项目目录缺失时列表报错、无法新建任务的问题
    - 修复添加的附加目录未包含进对话上下文的问题
    - 修复 MCP 应用未就绪时调用失败的问题
    - 修复终端启动时开头输出丢失的问题
releaseNotesByLocale:
    en-US:
        title: ""
        markdown: |-
            ## New Features

            - Local projects now support selecting multiple folders at once, with renaming support
            - Remote sessions now support persistent processes, so local disconnections no longer affect them
            - The input box now lets you switch models, adjust thinking effort, and select team plans directly
            - History sessions can now be archived and managed by project, with archived groups collapsed by default
            - Added remote device management to the Settings page
            - Windows taskbar and tray now show unread task notifications
            - Conversation sharing is now done via a popover, with support for workflow content and image previews
            - Added a plugin marketplace for browsing, installing, and managing plugins
            - Image preview now supports copying, downloading, and referencing images in conversations
            - Mobile remote control now supports account login for more secure connections
            - Added device management to mobile remote control
            - File browsing moved to the side panel and now supports multiple tabs
            - MiMo models now support two access methods: API and Token plans
            - Added tool search, allowing the assistant to find and load tools on demand

            ## Bug Fixes

            - Fixed an issue where network interruptions were misreported as the remote environment not meeting requirements
            - Fixed an issue where input was lost and conversations got stuck when model creation failed
            - Fixed an issue where conversations became unresponsive after reaching the context limit
            - Fixed an issue where attachments were misplaced or incorrectly marked as failed when restoring a history session
            - Fixed an issue where input being edited was overwritten when switching models
            - Fixed an issue where fallback was unavailable or input was lost when the accelerated model was unavailable
            - Fixed an issue where drafts were lost when switching projects or creating new tasks
            - Fixed incorrect unread counts and badge counts for tasks completed in the background
            - Fixed an issue where closed workspace tabs reappeared after restart
            - Fixed a security issue that could allow out-of-bounds reads of local files on Windows
            - Fixed an issue where connection logs could leak sensitive information
            - Fixed multiple display and interaction issues in the model menu and thinking slider
            - Fixed an issue where the Run button was pushed off screen when a workflow had too many parameters
            - Fixed occasional locking and lag after database upgrades
            - Fixed an issue where the list showed errors and new tasks could not be created when the project directory was missing
            - Fixed an issue where additional directories were not included in the conversation context after being added
            - Fixed an issue where calls failed when an MCP app was not ready
            - Fixed an issue where initial output was lost when the terminal started
